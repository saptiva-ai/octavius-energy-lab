[project]
name = "energy-lab-bench"
version = "0.1.0"
description = "Benchmarks del laboratorio (E1: PostgreSQL a escala)"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
energy-lab-bench = "energy_lab_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["energy_lab_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["energy_lab_bench", "energy_lab_ingest", "energy_lab_db", "conftest"]

[tool.ruff.lint.per-file-ignores]
"tests/test_resumen.py" = ["E501"]  # datos de prueba en una línea por registro
