[project]
name = "energy-lab-db"
version = "0.1.0"
description = "Migraciones y roles de la base energy_lab de Octavius Energy Lab"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
energy-lab-db = "energy_lab_db.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["energy_lab_db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["energy_lab_db", "conftest"]
