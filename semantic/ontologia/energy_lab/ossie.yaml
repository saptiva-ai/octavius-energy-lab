version: 0.2.0.dev0
name: energy_lab
datasets:
- name: consumo_cliente_cuarto_hora
  source: energy_lab.agg.consumo_cliente_cuarto_hora
  description: Potencia promedio de clientes eléctricos de Portugal (UCI, 2011-2014)
    por intervalo de 15 minutos.
  fields:
  - name: identificador_cliente
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cliente
    datatype: String
    description: A unique alphanumeric identifier for each customer record in the
      system.
  - name: momento_fecha_y_hora
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: momento
    datatype: DateTimeTz
    description: The exact date and time when a transaction or event occurred, recorded
      with timezone awareness.
  - name: potencia_promedio_k_w
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: potencia_kw
    datatype: Float
    description: 'Potencia promedio del intervalo en kW (la energía del intervalo
      es kW / 4 en kWh). — samples: 2.53807106598985, 1.26903553299492, 3.80710659898477,
      15.2284263959391, 5.0761421319797'
- name: consumo_hogar_diario
  source: energy_lab.agg.consumo_hogar_diario
  description: Consumo eléctrico total por hogar y día (UTC). lecturas cuenta las
    medias horas con dato; 48 es un día completo.
  fields:
  - name: hogar
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: hogar
    datatype: String
    description: Identifies the residential unit or customer account associated with
      the energy consumption record.
  - name: lecturas
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lecturas
    datatype: Integer
    description: Captures the raw meter reading values collected for the specified
      residential unit on a given date.
  - name: consumo_k_wh_diario
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: consumo_kwh
    datatype: Float
    description: 'Suma del consumo del día en kWh. — samples: 10.699000000000002,
      11.157000000000002, 10.074, 9.384, 14.340999999999996'
  - name: fecha_dia
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: dia
    datatype: Date
    description: 'Represents the calendar date on which the consumption data was recorded
      or aggregated. — format: YYYY-MM-DD'
  - name: grupo_tarifa
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: grupo_tarifa
    datatype: String
    description: Classifies the rate plan type applied to the account, distinguishing
      between standard and time-of-use billing structures.
- name: consumo_hogar_media_hora
  source: energy_lab.agg.consumo_hogar_media_hora
  description: Consumo eléctrico medido de cada hogar de Londres por media hora. Observaciones
    históricas, no pronósticos.
  fields:
  - name: momento
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: momento
    datatype: DateTimeTz
    description: Marca de tiempo en UTC de la lectura de media hora.
  - name: grupo_tarifa
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: grupo_tarifa
    datatype: String
    description: The rate group classification for a customer, indicating billing
      type such as ToU (Time of Use) or Std (Standard).
  - name: hogar
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: hogar
    datatype: String
    description: A unique identifier for a residential household, represented as a
      text code such as MAC000165.
  - name: consumo_k_wh
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: consumo_kwh
    datatype: Float
    description: 'Energía consumida en la media hora, en kWh. Puede ser nula si el
      medidor no reportó. — samples: 0.062, 0.058, 0.063, 0.061, 0.066'
- name: hogar
  source: energy_lab.agg.hogares
  description: Identificador anónimo del hogar (LCLid) y grupo de tarifa asociado
  fields:
  - name: identificador_del_hogar
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: hogar
    datatype: String
    description: 'Identificador anónimo del hogar (LCLid). — samples: MAC000002, MAC000003,
      MAC000004, MAC000006, MAC000007'
  - name: grupo_de_tarifa
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: grupo_tarifa
    datatype: String
    description: 'Std: tarifa plana. ToU: tarifa dinámica con bandas alta, normal
      y baja. — samples: Std, ToU'
- name: load_zone
  source: energy_lab.agg.zonas_carga
  description: Zonas de carga del Sistema Eléctrico Nacional de México según el catálogo
    de Nodos P de CENACE, con su centro de control regional y estados.
  fields:
  - name: states
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: estados
    datatype: String
    description: A state identifier representing the federal entity, with values such
      as SONORA, JALISCO, MICHOACAN DE OCAMPO, GUERRERO, and CHIHUAHUA.
  - name: system_type
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: sistema
    datatype: String
    description: 'SIN (interconectado), BCA (Baja California) o BCS (Baja California
      Sur). — samples: SIN, BCA, BCS'
  - name: node_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nodos
    datatype: Integer
    description: A numeric count of network nodes, with sample values including 12,
      20, 10, 37, and 8.
  - name: load_zone
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: zona_carga
    datatype: String
    description: A geographic region identifier representing the load zone, with values
      such as ENSENADA, MEXICALI, SANLUIS, TIJUANA, and CONSTITUCION.
  - name: control_center
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: centro_control
    datatype: String
    description: A control center identifier representing the operational region,
      with values such as ORIENTAL, OCCIDENTAL, NORESTE, NOROESTE, and PENINSULAR.
- name: precio_zona_hora
  source: energy_lab.agg.precio_zona_hora
  description: 'Precio de la energía por zona de carga y hora en el Mercado Eléctrico
    Mayorista de México (CENACE), en pesos por MWh, con sus componentes. MDA: mercado
    del día en adelanto; MTR: tiempo real. Puede ser negativo.'
  fields:
  - name: momento
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: momento
    datatype: DateTimeTz
    description: Inicio de la hora en UTC.
  - name: componente_energia_mxn_mwh
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: componente_energia_mxn_mwh
    datatype: Float
    description: Captures the base energy component price in Mexican pesos per megawatt-hour,
      excluding losses and congestion adjustments.
  - name: zona_de_carga
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: zona_carga
    datatype: String
    description: Identifies the specific load zone or region where electricity is
      consumed, using standardized geographic labels such as ACAPULCO or CENTRO-ORIENTE.
  - name: sistema
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: sistema
    datatype: String
    description: Represents the electrical grid system identifier, with SIN indicating
      the National Interconnected System.
  - name: centro_de_control
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: centro_control
    datatype: String
    description: Specifies the control center responsible for grid management, using
      regional labels like ORIENTAL, NORTE, or CENTRAL.
  - name: componente_perdidas_mxn_mwh
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: componente_perdidas_mxn_mwh
    datatype: Float
    description: Tracks the losses component cost in Mexican pesos per megawatt-hour,
      accounting for transmission and distribution inefficiencies.
  - name: proceso
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: proceso
    datatype: String
    description: Denotes the operational process code, such as MDA, applied within
      the energy market framework.
  - name: precio_total_mxn_mwh
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: precio_total_mxn_mwh
    datatype: Float
    description: Records the total energy price in Mexican pesos per megawatt-hour,
      reflecting the combined cost of energy, losses, and congestion.
  - name: componente_congestion_mxn_mwh
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: componente_congestion_mxn_mwh
    datatype: Float
    description: Measures the congestion component price in Mexican pesos per megawatt-hour,
      reflecting constraints or bottlenecks in the grid.
- name: tarifa_dinamica
  source: energy_lab.agg.tarifa_dinamica
  description: Precio por media hora de la tarifa dinámica (ToU) de Low Carbon London
    en 2013, en peniques por kWh.
  fields:
  - name: precio_p_kwh
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: precio_p_kwh
    datatype: Float
    description: The cost per kilowatt-hour of energy, expressed in decimal format
      with values such as 11.76, 3.99, and 67.2.
  - name: momento
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: momento
    datatype: DateTimeTz
    description: The exact date and time when the energy measurement was recorded,
      stored with timezone awareness.
  - name: banda
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: banda
    datatype: String
    description: The frequency band classification indicating the signal strength
      level, categorized as Normal, Baja, or Alta.
