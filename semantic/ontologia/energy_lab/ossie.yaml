version: 0.2.0.dev0
name: energy_lab
datasets:
- name: consumo_cliente_cuarto_hora
  source: energy_lab.agg.consumo_cliente_cuarto_hora
  description: Tracks power consumption and generation events for customers at quarter-hour
    intervals.
  fields:
  - name: customer_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cliente
    datatype: String
    description: Identifies the customer associated with the record using a unique
      alphanumeric code.
  - name: power_k_w
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: potencia_kw
    datatype: Float
    description: Measures the power consumption or generation in kilowatts at the
      moment of the event.
  - name: timestamp_utc
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: momento
    datatype: DateTimeTz
    description: Records the exact date and time of the event in Coordinated Universal
      Time.
- name: hogar
  source: energy_lab.agg.hogares
  description: A residential household entity.
  fields:
  - name: home_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: hogar
    datatype: String
    description: A unique identifier for a residential household, represented as a
      text code such as MAC000002.
  - name: rate_group
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: grupo_tarifa
    datatype: String
    description: The rate group classification for a customer, with values such as
      Std (standard) or ToU (time-of-use).
- name: home_daily_consumption
  source: energy_lab.agg.consumo_hogar_diario
  description: Daily energy consumption records for residential customers.
  fields:
  - name: home_account_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: hogar
    datatype: String
    description: A unique identifier for a residential customer account.
  - name: consumption_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: dia
    datatype: Date
    description: 'The date associated with the energy consumption record. — format:
      YYYY-MM-DD'
  - name: meter_readings_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lecturas
    datatype: Integer
    description: The number of meter readings recorded for the given period.
  - name: consumo_kwh
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: consumo_kwh
    datatype: Float
    description: The total electrical energy consumed measured in kilowatt-hours.
  - name: rate_plan_group
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: grupo_tarifa
    datatype: String
    description: The rate plan classification applied to the customer's electricity
      consumption.
- name: home_energy_consumption
  source: energy_lab.agg.consumo_hogar_media_hora
  description: Tracks residential energy consumption metrics over time.
  fields:
  - name: rate_plan_group
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: grupo_tarifa
    datatype: String
    description: Classifies the customer into a specific rate plan category, such
      as Time-of-Use or Standard.
  - name: consumo_kwh
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: consumo_kwh
    datatype: Float
    description: Measures the amount of electrical energy consumed in kilowatt-hours
      during the recorded period.
  - name: home_account
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: hogar
    datatype: String
    description: Identifies the residential customer account associated with the energy
      consumption record.
  - name: measurement_timestamp
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: momento
    datatype: DateTimeTz
    description: Records the exact date and time when the energy consumption measurement
      was taken.
- name: load_zone
  source: energy_lab.agg.zonas_carga
  description: Represents a geographic load zone within an electrical system.
  fields:
  - name: control_center_region
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: centro_control
    datatype: String
    description: Denotes the control center region, including ORIENTAL, OCCIDENTAL,
      NORESTE, NOROESTE, or PENINSULAR.
  - name: load_zone_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: zona_carga
    datatype: String
    description: Identifies the geographic load zone associated with the power system,
      such as ENSENADA or TIJUANA.
  - name: node_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nodos
    datatype: Integer
    description: Represents the count of grid nodes, with sample values ranging from
      8 to 37.
  - name: covered_states
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: estados
    datatype: String
    description: Lists the Mexican states covered by the dataset, such as SONORA,
      JALISCO, or CHIHUAHUA.
  - name: electrical_system_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: sistema
    datatype: String
    description: Specifies the electrical system code, for example SIN, BCA, or BCS.
- name: precio_zona_hora
  source: energy_lab.agg.precio_zona_hora
  description: Electricity pricing data for specific load zones and times within a
    power system.
  fields:
  - name: control_center_region
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: centro_control
    datatype: String
    description: Indicates the control center region (e.g., ORIENTAL, NOROESTE) responsible
      for grid management.
  - name: load_zone
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: zona_carga
    datatype: String
    description: Identifies the specific load zone (e.g., ACAPULCO, CAMPECHE) where
      electricity demand is measured within the power system.
  - name: precio_total_mxn_mwh
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: precio_total_mxn_mwh
    datatype: Float
    description: Represents the total electricity price in Mexican pesos per megawatt-hour
      for the given zone and time.
  - name: componente_perdidas_mxn_mwh
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: componente_perdidas_mxn_mwh
    datatype: Float
    description: Captures the losses component price in Mexican pesos per megawatt-hour
      due to transmission inefficiencies.
  - name: componente_congestion_mxn_mwh
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: componente_congestion_mxn_mwh
    datatype: Float
    description: Reflects the congestion component price in Mexican pesos per megawatt-hour
      for grid constraint management.
  - name: timestamp
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: momento
    datatype: DateTimeTz
    description: Records the exact timestamp with time zone when the price data was
      captured.
  - name: system
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: sistema
    datatype: String
    description: Specifies the electrical grid system (e.g., SIN) to which the transaction
      belongs.
  - name: componente_energia_mxn_mwh
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: componente_energia_mxn_mwh
    datatype: Float
    description: Shows the energy component price in Mexican pesos per megawatt-hour,
      excluding losses and congestion.
  - name: process_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: proceso
    datatype: String
    description: Denotes the operational process code (e.g., MDA) associated with
      the pricing event.
- name: tarifa_dinamica
  source: energy_lab.agg.tarifa_dinamica
  description: Dynamic energy pricing record
  fields:
  - name: energy_band
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: banda
    datatype: String
    description: Text label categorizing the energy band as Normal, Baja, or Alta.
  - name: price_per_k_wh
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: precio_p_kwh
    datatype: Float
    description: Electricity price per kilowatt-hour in double precision format.
  - name: timestamp_moment
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: momento
    datatype: DateTimeTz
    description: Timestamp indicating when the energy price measurement was recorded
      in UTC.
