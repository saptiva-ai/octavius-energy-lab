name: CI Pipeline

on:
  # push a main: el CD (cd.yml) se dispara con workflow_run de este CI.
  # paths-filter en push compara contra el commit anterior (event.before).
  push:
    branches: [main]
  pull_request:
    # P0-0: también los PRs contra las ramas de trabajo de la PoC, que van
    # muy por delante de main.
    branches: [main, 'feat/**']
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to test (comma-separated or "all")'
        required: false
        default: 'auto'
      skip_tests:
        description: 'Skip tests (use with caution)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # STAGE 1: DETECT CHANGES
  # ==========================================================================
  detect-changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      file-manager: ${{ steps.filter.outputs.file-manager }}
      embedding-service: ${{ steps.filter.outputs.embedding-service }}
      services: ${{ steps.matrix.outputs.services }}
      services_csv: ${{ steps.matrix.outputs.services_csv }}
      has_changes: ${{ steps.matrix.outputs.has_changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          # Servicios del monorepo con imagen propia.
          filters: |
            backend:
              - 'apps/backend/**'
            web:
              - 'apps/web/**'
              - 'packages/**'
            file-manager:
              - 'plugins/public/file-manager/**'
            embedding-service:
              - 'plugins/public/embedding-service/**'

      - name: Build service matrix
        id: matrix
        # El input va por env y no interpolado en el script: así un valor con
        # comillas o $(...) no se ejecuta en el runner.
        env:
          SERVICES_INPUT: ${{ github.event.inputs.services }}
        run: |
          # Manual override
          if [[ ! "$SERVICES_INPUT" =~ ^[a-z,-]*$ ]]; then
            echo "::error::services solo admite letras minúsculas, guiones y comas"
            exit 1
          fi
          if [[ "$SERVICES_INPUT" == "all" ]]; then
            echo 'services=["backend","web","file-manager","embedding-service"]' >> $GITHUB_OUTPUT
            echo "services_csv=backend,web,file-manager,embedding-service" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
            exit 0
          elif [[ "$SERVICES_INPUT" != "auto" && -n "$SERVICES_INPUT" ]]; then
            SERVICES="$SERVICES_INPUT"
            echo "services=[\"${SERVICES//,/\",\"}\"]" >> $GITHUB_OUTPUT
            echo "services_csv=$SERVICES" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Auto-detect from paths
          SERVICES=()

          [[ "${{ steps.filter.outputs.backend }}" == "true" ]] && SERVICES+=("backend")
          [[ "${{ steps.filter.outputs.web }}" == "true" ]] && SERVICES+=("web")
          [[ "${{ steps.filter.outputs.file-manager }}" == "true" ]] && SERVICES+=("file-manager")
          # embedding-service no tiene pruebas: solo cuenta como cambio.
          [[ "${{ steps.filter.outputs.embedding-service }}" == "true" ]] && SERVICES+=("embedding-service")

          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo "services=[]" >> $GITHUB_OUTPUT
            echo "services_csv=" >> $GITHUB_OUTPUT
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            JSON=$(printf '%s\n' "${SERVICES[@]}" | jq -R . | jq -s -c .)
            CSV=$(IFS=,; echo "${SERVICES[*]}")
            echo "services=$JSON" >> $GITHUB_OUTPUT
            echo "services_csv=$CSV" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Summary
        run: |
          echo "## 🔍 CI Change Detection" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Changed |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| backend | ${{ steps.filter.outputs.backend }} |" >> $GITHUB_STEP_SUMMARY
          echo "| web | ${{ steps.filter.outputs.web }} |" >> $GITHUB_STEP_SUMMARY
          echo "| file-manager | ${{ steps.filter.outputs.file-manager }} |" >> $GITHUB_STEP_SUMMARY
          echo "| embedding-service | ${{ steps.filter.outputs.embedding-service }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Services to test:** ${{ steps.matrix.outputs.services_csv || 'none' }}" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # STAGE 1.5: SECURITY SCAN (reporte, no bloquea el gate)
  # Se quita del ci-gate hasta cerrar los CVE de uv.lock.
  # ==========================================================================
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Trivy
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '0'

      - name: Security summary
        if: always()
        run: |
          echo "## 🔒 Security Scan (reporte)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Trivy informa CRITICAL/HIGH sin bloquear el CI Gate. Resultado del escaneo: ${{ steps.trivy.outcome }}." >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # STAGE 2: TEST (Conditional per service)
  # ==========================================================================
  test-backend:
    name: 🧪 Test Backend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      github.event.inputs.skip_tests != 'true' &&
      contains(needs.detect-changes.outputs.services, 'backend')

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: 'latest'
          enable-cache: true
          cache-dependency-glob: |
            apps/backend/requirements.txt
            apps/backend/uv.lock

      - name: Install dependencies
        run: |
          cd apps/backend
          uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system -r requirements.txt
          uv pip install --system ruff==0.16.5 pytest pytest-cov pytest-asyncio mongomock_motor

      - name: Lint (Ruff)
        run: |
          cd apps/backend
          ruff check src/
          ruff format --check src/

      - name: Unit Tests
        env:
          TEST_MODE: 'true'
        run: |
          cd apps/backend
          pytest tests/unit -q \
            --ignore=tests/integration --ignore=tests/system \
            --tb=short

  test-web:
    name: 🧪 Test Frontend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      github.event.inputs.skip_tests != 'true' &&
      contains(needs.detect-changes.outputs.services, 'web')

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type Check
        run: bun run bun:typecheck:web

      - name: Lint
        run: bun run bun:lint:web

      - name: Tests
        run: bun run bun:test:web

  test-file-manager:
    name: 🧪 Test File Manager
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      github.event.inputs.skip_tests != 'true' &&
      contains(needs.detect-changes.outputs.services, 'file-manager')

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: 'latest'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: |
          cd plugins/public/file-manager
          # Skip grpcio-tools (proto compiler, stubs already in git)
          grep -v -E 'grpcio-tools' \
            requirements.txt | uv pip install --system -r -
          uv pip install --system pytest pytest-asyncio pytest-cov pytest-mock

      - name: Smoke + Unit + Regression Tests
        env:
          TEST_MODE: 'true'
          PYTHONPATH: plugins/public/file-manager
        run: |
          cd plugins/public/file-manager
          pytest tests/smoke tests/unit tests/regression \
            -v --tb=short --ignore=tests/integration

  # P0-0 de la auditoría (2026-10-09): la suite del plugin (~830 pruebas,
  # 15 s) no corría en CI. torch y timesfm3 no se instalan: sus pruebas se
  # saltan solas con importorskip, igual que en el venv local.
  # ==========================================================================
  # STAGE 2.5: REGRESSION TESTS (Backend critical paths)
  # ==========================================================================
  test-regression:
    name: 🔒 Regression Tests
    runs-on: ubuntu-latest
    needs: [detect-changes, test-backend]
    if: |
      github.event.inputs.skip_tests != 'true' &&
      needs.test-backend.result == 'success' &&
      contains(needs.detect-changes.outputs.services, 'backend')

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: 'latest'
          enable-cache: true
          cache-dependency-glob: |
            apps/backend/requirements.txt
            apps/backend/uv.lock

      - name: Install dependencies
        run: |
          cd apps/backend
          uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system -r requirements.txt
          uv pip install --system pytest pytest-asyncio pytest-cov mongomock_motor httpx

      - name: Run Backend Regression Tests
        env:
          TEST_MODE: 'true'
          MONGODB_URL: mongodb://localhost:27017/test_db
          REDIS_URL: redis://localhost:6379
          ENVIRONMENT: test
          # Deterministic test-only secret (>=32 chars per core/secrets.py
          # validation). NOT a real secret — only used by CI to satisfy
          # jwt.encode HMAC key requirement during auth-flow tests.
          JWT_SECRET_KEY: 'ci-test-only-jwt-secret-min32chars-placeholder'
          SECRET_KEY: 'ci-test-only-app-secret-min32chars-placeholder'
        run: |
          cd apps/backend
          pytest tests/regression -v -m regression --tb=short --no-cov || exit 1

      - name: Regression Summary
        if: always()
        run: |
          echo "## 🔒 Regression Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Backend critical path tests completed." >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # STAGE 3: INTEGRATION SMOKE TESTS
  # ==========================================================================
  test-backend-integration-smoke:
    name: 🔗 Backend Integration Smoke
    runs-on: ubuntu-latest
    needs: [detect-changes, test-backend]
    if: |
      github.event.inputs.skip_tests != 'true' &&
      needs.test-backend.result == 'success' &&
      contains(needs.detect-changes.outputs.services, 'backend')

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: 'latest'
          enable-cache: true
          cache-dependency-glob: |
            apps/backend/requirements.txt
            apps/backend/uv.lock

      - name: Install dependencies
        run: |
          cd apps/backend
          uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system -r requirements.txt
          uv pip install --system pytest pytest-asyncio pytest-cov mongomock_motor httpx

      - name: Run Integration Smoke Tests
        env:
          TEST_MODE: 'true'
          MONGODB_URL: mongodb://localhost:27017/test_db
          REDIS_URL: redis://localhost:6379
          ENVIRONMENT: test
          # Deterministic test-only secret (see Regression Tests step note).
          JWT_SECRET_KEY: 'ci-test-only-jwt-secret-min32chars-placeholder'
          SECRET_KEY: 'ci-test-only-app-secret-min32chars-placeholder'
        run: |
          cd apps/backend
          pytest \
            tests/integration/test_auth_flow.py \
            tests/integration/test_auth_regression.py \
            -v --tb=short --no-cov

  # ==========================================================================
  # STAGE 3.5: WEB E2E SMOKE TESTS
  # ==========================================================================
  # Informativo, fuera del gate (2026-11-08): sobre `next dev` en el runner
  # falla en pruebas distintas cada corrida (auth, files, caché de gráficas)
  # con timeouts de 30 s mientras Next compila; tres corridas seguidas
  # bloquearon el CD de web 1.0.22 sin que el código tuviera nada que ver.
  # Sigue corriendo y su resultado se ve en su job y en los artefactos.
  # continue-on-error: el CD solo arranca si la corrida completa termina en
  # success; sin esto, una falla aquí seguía saltando el CD (web 1.0.23).
  test-web-e2e-smoke:
    name: 🌐 Web UI Mocked Smoke
    continue-on-error: true
    runs-on: ubuntu-latest
    needs: [detect-changes, test-web]
    timeout-minutes: 25
    if: |
      github.event.inputs.skip_tests != 'true' &&
      needs.test-web.result == 'success' &&
      contains(needs.detect-changes.outputs.services, 'web')

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: |
          cd apps/web
          bun install --frozen-lockfile

      - name: Install Playwright (Chromium)
        run: |
          cd apps/web
          bunx playwright install --with-deps chromium

      - name: Run E2E Smoke Tests
        env:
          E2E_USE_API_MOCKS: '1'
          E2E_BASE_URL: 'http://127.0.0.1:3000'
        run: |
          cd apps/web
          # Suite completa (antes solo navigation.spec): auth, files,
          # navigation y chat-analytics (contrato AnalyticsResponse → canvas).
          # Los casos con race conocida están en test.fixme (se saltan solos).
          bun run test:e2e -- --project=chromium --workers=1 --retries=1

      - name: Upload Playwright Artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-smoke-${{ github.run_id }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  no-changes:
    name: ℹ️ No Changes
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'false'

    steps:
      - run: |
          echo "## ℹ️ No Service Changes" >> $GITHUB_STEP_SUMMARY
          echo "No backend/web changes detected. CI tests skipped." >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # GATE: Single required check for branch protection
  # ==========================================================================
  ci-gate:
    name: ✅ CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - detect-changes
      - test-backend
      - test-web
      - test-file-manager
      - test-regression
      - test-backend-integration-smoke
      - test-web-e2e-smoke

    steps:
      - name: Evaluate results
        run: |
          echo "## ✅ CI Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Security Scan y Web UI Mocked Smoke no están en el gate: son reportes (ver su job)._" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          FAILED=false

          # detect-changes entra al gate: si falla, todo lo demás se salta y
          # sin esta línea el gate pasaría en verde.
          for job in \
            "detect-changes:${{ needs.detect-changes.result }}" \
            "test-backend:${{ needs.test-backend.result }}" \
            "test-web:${{ needs.test-web.result }}" \
            "test-file-manager:${{ needs.test-file-manager.result }}" \
            "test-regression:${{ needs.test-regression.result }}" \
            "test-backend-integration-smoke:${{ needs.test-backend-integration-smoke.result }}"
          do
            NAME="${job%%:*}"
            RESULT="${job##*:}"

            if [[ "$RESULT" == "failure" || "$RESULT" == "cancelled" ]]; then
              echo "| $NAME | ❌ $RESULT |" >> $GITHUB_STEP_SUMMARY
              FAILED=true
            else
              echo "| $NAME | ✅ $RESULT |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          # Informativo: se reporta, no decide.
          echo "| test-web-e2e-smoke (informativo) | ℹ️ ver su job |" >> $GITHUB_STEP_SUMMARY

          if [[ "$FAILED" == "true" ]]; then
            echo ""
            echo "**❌ CI Gate FAILED — one or more jobs failed or were cancelled.**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**All required checks passed (or were correctly skipped).**" >> $GITHUB_STEP_SUMMARY
