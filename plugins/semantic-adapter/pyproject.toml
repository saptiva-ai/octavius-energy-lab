[project]
name = "semantic-adapter"
version = "0.1.0"
description = "Plugin MCP de capa semántica: búsqueda de términos y verificación de respondibilidad sobre la ontología"
requires-python = ">=3.11"
dependencies = [
    "agno==2.7.3",
    "fastapi>=0.115",
    "fastmcp>=2.0.0",
    "openai>=1.60",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
semantic-adapter = "semantic_adapter.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_adapter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["semantic_adapter", "conftest"]
